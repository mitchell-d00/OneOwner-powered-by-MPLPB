name: OneOwner product and pinned-engine validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail-closed OneOwner adapter / build tests
        run: |
          node --check oneowner/adapter.js
          node --check oneowner/chat.js
          node --check oneowner/discovery.js
          node --check oneowner/learn.js
          node --check oneowner/settings.js
          node --check oneowner/source-capture.js
          node --check oneowner/app.js
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -p 'test_*.py' -v

  archive-first:
    needs: product-tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout product candidate
        uses: actions/checkout@v4
        with:
          path: product
      - name: Checkout exact reviewed research revision
        uses: actions/checkout@v4
        with:
          repository: mitchell-d00/Combined-MPLPB-A-closed-local-ledger-of-pages-that-answers-only-from-those-pages
          ref: acf7800a5f8320ec29ee957d002eaaba8ed4e816
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm pinned engine revision before any tests
        run: |
          test "$(git -C engine rev-parse HEAD)" = "$(python -c "import json;print(json.load(open('product/upstream.lock.json'))['commit'])")"
          test -z "$(git -C engine diff --name-only HEAD)"
      - name: Run full original Python, validation and kill-test suites
        working-directory: engine
        run: |
          python -m unittest discover -s tests -q
          python tools/check_repository_infrastructure.py
          python -m tools.audit_documentation
          python -m tools.verify_reference_evidence
      - name: Run original JavaScript and browser-transport tests
        working-directory: engine
        run: |
          python tools/check_ui_script.py
          node tools/check_browser_transport.cjs
          node tests/javascript-api.cjs
          node crawler/test_worker.mjs
      - name: Obtain the upstream pinned Pyodide core
        run: >-
          curl --fail --location --retry 2
          https://github.com/pyodide/pyodide/releases/download/314.0.7/pyodide-core-314.0.7.tar.bz2
          --output "$RUNNER_TEMP/pyodide-core-314.0.7.tar.bz2"
      - name: Build original WASM runtime through the original builder
        working-directory: engine
        run: >-
          python tools/build_browser_runtime.py
          --core-archive "$RUNNER_TEMP/pyodide-core-314.0.7.tar.bz2"
          --output dist/MPLPB_Browser.html
      - name: Exercise unchanged original Python/WebAssembly engine
        working-directory: engine
        run: |
          tar -xjf "$RUNNER_TEMP/pyodide-core-314.0.7.tar.bz2" -C "$RUNNER_TEMP"
          node tools/check_browser_wasm.mjs "$RUNNER_TEMP/pyodide" dist/MPLPB_Browser.html
      - name: Build product ZIP with SHA-256 file manifest
        working-directory: product
        run: >-
          python scripts/build_oneowner.py
          --engine ../engine
          --standalone ../engine/dist/MPLPB_Browser.html
          --output dist/OneOwner.html
          --zip dist/OneOwner.zip
      - name: Extract product archive and retest the exact archive contents
        run: |
          mkdir extracted
          unzip -q product/dist/OneOwner.zip -d extracted
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('extracted')
          m=json.loads((root/'ONEOWNER-MANIFEST.json').read_text())
          for name,digest in m['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          assert (root/'OneOwner.html').exists()
          assert (root/'desktop/.github/workflows/pr-validation.yml').exists()
          print('Extracted archive manifest and hidden workflows verified')
          PY
          cd extracted/desktop
          python -m unittest discover -s tests -q
          node tests/javascript-api.cjs
          # The desktop product index is intentionally presentation-adapted;
          # original infrastructure synchronization was validated before packaging.
      - name: Install pinned Chromium automation
        run: python -m pip install 'playwright==1.58.0'
      - name: Run independent OneOwner website journey from extracted archive
        run: >-
          python product/tests/browser_oneowner.py
          --html extracted/OneOwner.html
          --browser-executable "$(command -v google-chrome)"
          --screenshots "$RUNNER_TEMP/oneowner-browser"
      - name: Run synthetic first-time user journeys on packaged OneOwner and original engine
        run: >-
          python product/tests/synthetic_user_oneowner.py
          --html extracted/OneOwner.html
          --browser-executable "$(command -v google-chrome)"
          --output "$RUNNER_TEMP/oneowner-synthetic/report.json"
          --screenshots "$RUNNER_TEMP/oneowner-synthetic/screenshots"
      - name: Synthetic novice chat journey with real persisted MPLPB engine
        run: >-
          python product/tests/browser_chat_oneowner.py
          --html extracted/OneOwner.html
          --browser-executable "$(command -v google-chrome)"
          --output "$RUNNER_TEMP/oneowner-chat/report.json"
          --screenshots "$RUNNER_TEMP/oneowner-chat/screenshots"
      - name: Beginner and advanced learning journey with offline native MPLPB chat
        run: >-
          python product/tests/browser_learn_oneowner.py
          --html extracted/OneOwner.html
          --browser-executable "$(command -v google-chrome)"
          --output "$RUNNER_TEMP/oneowner-learn/report.json"
          --screenshots "$RUNNER_TEMP/oneowner-learn/screenshots"
      - name: Chromium link snapshot with original CORS capture and seal pipeline
        run: >-
          python product/tests/browser_link_capture.py
          --html extracted/OneOwner.html
          --browser-executable "$(command -v google-chrome)"
          --output "$RUNNER_TEMP/oneowner-link/report.json"
          --screenshots "$RUNNER_TEMP/oneowner-link/screenshots"
      - name: Chromium user settings, theme persistence and ledger authority check
        run: >-
          python product/tests/browser_settings_oneowner.py
          --html extracted/OneOwner.html
          --browser-executable "$(command -v google-chrome)"
          --output "$RUNNER_TEMP/oneowner-settings/report.json"
          --screenshots "$RUNNER_TEMP/oneowner-settings/screenshots"
      - name: Native guided choices, inline search and optional AI negative probes
        run: >-
          python product/tests/browser_discovery_oneowner.py
          --html extracted/OneOwner.html
          --browser-executable "$(command -v google-chrome)"
          --output "$RUNNER_TEMP/oneowner-discovery/report.json"
          --screenshots "$RUNNER_TEMP/oneowner-discovery/screenshots"
      - name: Preserve ZIP and candidate evidence (not deployed-site evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneowner-candidate-${{ github.run_id }}
          path: |
            product/dist/OneOwner.zip
            product/dist/OneOwner.html
            ${{ runner.temp }}/oneowner-browser/
            ${{ runner.temp }}/oneowner-synthetic/
            ${{ runner.temp }}/oneowner-chat/
            ${{ runner.temp }}/oneowner-link/
            ${{ runner.temp }}/oneowner-learn/
            ${{ runner.temp }}/oneowner-settings/
            ${{ runner.temp }}/oneowner-discovery/
          if-no-files-found: warn
          retention-days: 30

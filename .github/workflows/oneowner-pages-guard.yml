name: Repair OneOwner Pages source and restore validated app

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneowner-pages-guard.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: oneowner-pages
  cancel-in-progress: false

jobs:
  repair-and-restore:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Restore the last independently validated OneOwner app while new main builds
        uses: actions/download-artifact@v4
        with:
          name: oneowner-candidate-41516305139
          run-id: 41516305139
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Prepare only validated application bytes, never the README
        shell: bash
        run: |
          set -euo pipefail
          html="$(find candidate -type f -name 'OneOwner.html' -print -quit)"
          test -n "$html" && test -s "$html"
          mkdir -p site
          cp "$html" site/index.html
          touch site/.nojekyll
          grep -q 'OneOwner dedicated page: original engine unchanged' site/index.html
          grep -q 'oneowner-app: CSP compatible' site/index.html
          grep -q '<title>OneOwner' site/index.html
          sha256sum site/index.html
          echo "Restoring validated product from run 41516305139 until a newer successful main build is released."
      - name: Synchronize the validated page into main/index.html
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: true
      - name: Repair default Pages entry point and retain the original engine
        shell: bash
        run: |
          set -euo pipefail
          cp site/index.html source/index.html
          touch source/.nojekyll
          git -C source config user.name 'github-actions[bot]'
          git -C source config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C source add index.html .nojekyll
          if ! git -C source diff --cached --quiet; then
            git -C source commit -m 'Restore validated OneOwner application at root index.html'
            git -C source push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        name: Publish standalone OneOwner page
        uses: actions/deploy-pages@v4
      - name: Verify live URL serves the app rather than README
        shell: bash
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 10 --retry-delay 6 "$PAGE_URL" -o deployed.html
          grep -q 'OneOwner dedicated page: original engine unchanged' deployed.html
          grep -q '<title>OneOwner' deployed.html
          if grep -q '^<h1>OneOwner-powered-by-MPLPB</h1>' deployed.html; then
            echo "::error::GitHub Pages is displaying a repository README instead of OneOwner."
            exit 1
          fi
          echo "Live OneOwner app verified; root index.html now prevents README fallback."

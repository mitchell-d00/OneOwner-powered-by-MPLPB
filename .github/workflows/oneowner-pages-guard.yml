name: Repair OneOwner Pages source and restore validated app

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneowner-pages-guard.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: oneowner-pages
  cancel-in-progress: false

jobs:
  repair-and-restore:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Switch Pages off branch Jekyll builds and verify mode
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$TARGET_REPO/pages"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${headers[@]}" "$api" -o pages-before.json
          mode="$(python3 -c 'import json;print(json.load(open("pages-before.json")).get("build_type","unknown"))')"
          echo "Pages source before repair: $mode"
          if [ "$mode" != "workflow" ]; then
            if ! curl --fail --silent --show-error -X PUT "${headers[@]}" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "$api"; then
              echo "::error::GitHub denied automatic Pages source configuration. In OneOwner Settings > Pages > Build and deployment, select GitHub Actions instead of Deploy from a branch; then rerun this workflow."
              exit 1
            fi
          fi
          curl --fail --silent --show-error "${headers[@]}" "$api" -o pages-after.json
          actual="$(python3 -c 'import json;print(json.load(open("pages-after.json")).get("build_type","unknown"))')"
          echo "Pages source after repair: $actual"
          if [ "$actual" != "workflow" ]; then
            echo "::error::Pages still uses branch/Jekyll. Switch Settings > Pages > Source to GitHub Actions."
            exit 1
          fi
      - name: Restore the last independently validated OneOwner app while new main builds
        uses: actions/download-artifact@v4
        with:
          name: oneowner-candidate-41516305139
          run-id: 41516305139
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Prepare only validated application bytes, never the README
        shell: bash
        run: |
          set -euo pipefail
          html="$(find candidate -type f -name 'OneOwner.html' -print -quit)"
          test -n "$html" && test -s "$html"
          mkdir -p site
          cp "$html" site/index.html
          touch site/.nojekyll
          grep -q 'OneOwner dedicated page: original engine unchanged' site/index.html
          grep -q 'oneowner-app: CSP compatible' site/index.html
          grep -q '<title>OneOwner' site/index.html
          sha256sum site/index.html
          echo "Restoring validated product from run 41516305139 until a newer successful main build is released."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        name: Publish standalone OneOwner page
        uses: actions/deploy-pages@v4
      - name: Verify live URL serves the app rather than README
        shell: bash
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 10 --retry-delay 6 "$PAGE_URL" -o deployed.html
          grep -q 'OneOwner dedicated page: original engine unchanged' deployed.html
          grep -q '<title>OneOwner' deployed.html
          if grep -q '^<h1>OneOwner-powered-by-MPLPB</h1>' deployed.html; then
            echo "::error::GitHub Pages is displaying a repository README instead of OneOwner."
            exit 1
          fi
          echo "Live OneOwner app verified; branch-based Jekyll publishing disabled."

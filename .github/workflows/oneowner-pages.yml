name: Publish validated OneOwner website

on:
  workflow_run:
    workflows: ["OneOwner product and pinned-engine validation"]
    types: [completed]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: oneowner-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Retrieve validated OneOwner candidate from successful main run
        uses: actions/download-artifact@v4
        with:
          name: oneowner-candidate-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Build OneOwner-only site root from tested bytes
        shell: bash
        run: |
          set -euo pipefail
          html="$(find candidate -type f -name OneOwner.html -print -quit)"
          test -n "$html" && test -s "$html"
          mkdir -p site
          cp "$html" site/index.html
          printf '%s\n' 'OneOwner - Powered by Combined MPLPB' > site/README.txt
          touch site/.nojekyll
          sha256sum site/index.html
      - name: Checkout OneOwner main for branch-based Pages compatibility
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: true
      - name: Keep main/index.html synchronized with the validated application
        shell: bash
        run: |
          set -euo pipefail
          # Existing branch-based Pages must NEVER build the README instead of OneOwner.
          # Store the exact tested application bytes in the repo root as MPLPB does.
          cp site/index.html source/index.html
          grep -q 'OneOwner dedicated page: original engine unchanged' source/index.html
          touch source/.nojekyll
          git -C source config user.name 'github-actions[bot]'
          git -C source config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C source add index.html .nojekyll
          if ! git -C source diff --cached --quiet; then
            git -C source commit -m 'Publish validated OneOwner standalone index.html'
            git -C source push origin HEAD:main
          else
            echo 'Root app already matches validated artifact.'
          fi
      - name: Configure independent OneOwner Pages deployment
        uses: actions/configure-pages@v5
      - name: Upload the exact validated OneOwner page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        name: Publish to OneOwner repository website only
        uses: actions/deploy-pages@v4
      - name: Verify published OneOwner page responds with dedicated product identity
        shell: bash
        env:
          ONEOWNER_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-delay 5 "$ONEOWNER_URL" -o deployed.html
          grep -q 'OneOwner dedicated page: original engine unchanged' deployed.html
          grep -q '<title>OneOwner' deployed.html
          echo "The separately deployed OneOwner HTML has the product marker and title."
